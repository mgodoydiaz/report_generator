[pytest]
# Dónde buscar tests
testpaths = tests

# Patrón de descubrimiento
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers — usar @pytest.mark.<name>
# --strict-markers obliga a declararlos acá: cualquier marker no listado falla
markers =
    unit: tests sin I/O, <100ms — corre en pre-commit
    integration: tests con db_session/client TestClient — <500ms
    slow: tests >1s (generación PDF, ETL completo) — excluidos por default en `-m "not slow"`

# Flags por default
addopts =
    --strict-markers
    --tb=short
    -ra

# Filtrar warnings ruidosos
filterwarnings =
    ignore::DeprecationWarning:pkg_resources
    ignore::DeprecationWarning:pydantic
