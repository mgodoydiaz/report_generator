[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rgenerator"
dynamic = ["version"]
description = "Motor de ETL y reportería académica para Fundación PHP"
readme = "README.md"
authors = [
    {name = "Fundación PHP"},
    {name = "Miguel Godoy Díaz", email = "magodoydiaz@gmail.com"}
]
requires-python = ">=3.10"
license = {text = "MIT License"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.23",
    "matplotlib>=3.7",
    "camelot-py[cv]>=0.11",
    "PyMuPDF>=1.23",
    "Pillow>=10.0",
    "tqdm>=4.65",
    "xlrd>=2.0",
    "requests>=2.31",
    "openpyxl",
    "docxtpl",
    "docx2pdf",
    "fastapi",
    "uvicorn"
]

[project.urls]
Homepage = "https://github.com/fphp/website-ui"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["rgenerator", "rgenerator.*"]

[tool.setuptools.dynamic]
version = {attr = "rgenerator._version.__version__"}


# ─────────────────────────────────────────────────────────────────────────
# Coverage config (pytest-cov lee esto)
# ─────────────────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["backend"]
# Archivos que no son módulos de producción — su 0% de cobertura sería
# ruido. Si alguno se vuelve relevante en el futuro, removerlo de aquí.
omit = [
    "backend/test_eval.py",            # scratch experimental para eval() con pandas
    "backend/read_pipe.py",            # script one-shot de migración XLSX→JSON
    "backend/init_indicators_db.py",   # bootstrap legacy pre-DB con path Windows hardcoded
    "backend/cli.py",                  # CLI admin, no se invoca desde tests
    "backend/__main__.py",
    # Tests mismos no deberían contar
    "*/tests/*",
    # Migrations Alembic (autogeneradas, sin valor de testing)
    "*/alembic/*",
    "*/migrations/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Líneas que cuentan como "cubiertas si nadie las llama" — el reporte
# las muestra como omitidas en lugar de no-cubiertas.
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
